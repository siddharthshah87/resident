[individual]
name = "ops"
purpose = "Shop operator: watches the shop's app containers, its dashboard and its social poster"

[capabilities]
spawn = true
"container.inspect" = ["shop-app-*"]
"container.restart" = ["shop-app-*"]
"browser.visit" = ["http://127.0.0.1:3000/*", "https://social.example.com/*"]

[approval_required]
verbs = ["container.restart", "unit.restart"]

[budget]
usd_per_day = 3.0
memory_mb = 512
cpus = 0.5
max_children = 2
