# resident bootable image — mkosi configuration (target: mkosi >= 25; see README "mkosi version").
# Debian trixie, systemd-boot + UKI, dm-verity read-only root, A/B root slots, writable /var,
# persistent /etc overlay on /var. Partition layout lives in mkosi.repart/ (install image) and
# mkosi.extra/usr/lib/repart.d/ (first-boot grow). A/B updates: mkosi.extra/usr/lib/sysupdate.d/.
#
# UNTESTED: written on a host without sudo/qemu/mkosi. Validate with `mkosi --debug summary` first.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# non-free-firmware: intel-microcode + iwlwifi for the NUC. Drop if you want a free-only image.
Repositories=main,non-free-firmware

[Output]
Format=disk
ImageId=resident
# Overridden per build by build.sh (--image-version=YYYY.MM.DD.N). Becomes IMAGE_VERSION in
# os-release, the root partition label (resident_<ver>) and the UKI filename — sysupdate keys on all three.
ImageVersion=2026.10.27.1
OutputDirectory=out
CompressOutput=no
# Emit the per-partition raw files + UKI next to the disk image: these are exactly the artifacts
# systemd-sysupdate consumes for the A/B update (see update.sh).
# mkosi v20 spelling: SplitArtifacts=yes
SplitArtifacts=uki,partitions
RepartDirectories=mkosi.repart

[Build]
# Ubuntu 24.04 host tools (systemd 255, no mkfs.erofs) are too old for verity+erofs+ukify;
# let mkosi fetch a matching tools tree. mkosi v20 spelling: [Host] ToolsTree=default
ToolsTree=default
Incremental=yes
# required by Incremental= (mkosi asserts on it); also caches downloaded packages between builds
CacheDirectory=mkosi.cache

[Content]
Bootable=yes
Bootloader=systemd-boot
# mkosi >= 26: "yes" means "signed" = use a distro pre-built UKI (Debian ships none). We build our own.
UnifiedKernelImages=unsigned
# Boot-assessment filename convention: "+3" = 3 tries left (systemd-boot decrements per boot,
# systemd-bless-boot strips it once boot-complete.target is reached). CHECK: mkosi also offers %c.
UnifiedKernelImageFormat=%i_%v+3
# No root= : systemd-gpt-auto picks the root/verity pair whose partition UUIDs derive from roothash=
# (mkosi appends roothash= automatically when a verity partition is present).
KernelCommandLine=ro console=ttyS0,115200n8 console=tty0 systemd.show_status=auto audit=0 rd.systemd.gpt_auto=yes
Hostname=resident
Locale=C.UTF-8
Timezone=UTC
Autologin=no
WithDocs=no
CleanPackageMetadata=yes
# Baked ssh host keys would be identical in every image → generated at first ssh start instead
# (etc/systemd/system/ssh.service.d/resident.conf).
RemoveFiles=/etc/ssh/ssh_host_*

# Package groups — every group is explained in intents.json (author "image").
Packages=
        # boot + init + updates
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-ukify
        # first-boot partition growth (repart.d) and the A/B updater (Debian ships systemd-sysupdate in systemd-container)
        systemd-repart
        systemd-container
        systemd-resolved
        systemd-timesyncd
        udev
        kmod
        linux-image-amd64
        intel-microcode
        firmware-iwlwifi
        # buses + policy = the agent-as-principal substrate
        dbus
        dbus-user-session
        polkitd
        libpam-systemd
        libnss-systemd
        # break-glass + privileged wrapper
        openssh-server
        sudo
        # resident tooling runtime (lib/agentos.py is stdlib-only; agentd needs a venv + nodejs for the Claude Code CLI)
        python3
        python3-venv
        python3-pip
        nodejs
        npm
        apt
        dpkg
        iproute2
        procps
        util-linux
        e2fsprogs
        ca-certificates
        curl
        xz-utils
        jq
        less
        # agent browser
        chromium
        fonts-dejavu-core

[Validation]
SecureBoot=no

[Runtime]
# mkosi >= 25 (`mkosi vm`). v20 spelling: [Host] QemuMem=4G QemuKvm=yes QemuFirmware=uefi (`mkosi qemu`).
RAM=4G
KVM=yes
Firmware=uefi
