# Runtime directory layout on /var (the writable partition). Root stays verity-sealed.
#Type Path                                   Mode  User       Group      Age Argument
d     /var/home                              0755  root       root       -
d     /var~                    0700  owner  owner  -
d     /var/srv                               0755  root       root       -
d     /var/opt                               0755  root       root       -
d     /var/log/journal                       2755  root       systemd-journal -
# agent principal state ($RESIDENT_HOME). inbox is group-writable: any service in group `agent`
# may drop an event for the resident agent (the event bus is a directory of JSON files).
d     /var/lib/resident                       0750  agent      agent      -
L     /var/lib/resident/resident               -     -          -          -   .
d     /var/lib/resident/inbox                 0770  agent      agent      -
d     /var/lib/resident/inbox/done            0770  agent      agent      -
d     /var/lib/resident/outbox                0750  agent      agent      -
d     /var/lib/resident/agentd                0750  agent      agent      -
d     /var/lib/resident/percept               0750  agent      agent      -
d     /var/lib/resident/browser               0750  agent      agent      -
d     /var/lib/resident/browser/profile       0700  agent      agent      -
d     /var/lib/resident/browser/shots         0750  agent      agent      -
d     /var/lib/resident/credentials           0700  agent      agent      -
d     /var/lib/resident/consent               0700  agent      agent      -
d     /var/lib/resident/.config               0700  agent      agent      -
d     /var/cache/resident                     0750  agent      agent      -
# compatibility: agentd.py hardcodes ~/resident — point it at the agent's state dir.
L     /var~/resident            -     -          -          -   /var/lib/resident
# human-owned: update staging and the /etc overlay (root only)
d     /var/lib/resident/updates               0755  root       root       -
d     /var/lib/resident/etc-overlay           0700  root       root       -
# audit trail of the privileged wrapper: root writes, agent may read its own trail
d     /var/log/resident                       0750  root       agent      -
f     /var/log/resident/privileged.log        0640  root       agent      -
# the agent gets a user session (systemd --user, /run/user/980) even with nobody logged in:
# desktop variant runs cage + xdg-desktop-portal in it.
f     /var/lib/systemd/linger/agent          0644  root       root       -
