# The agent is a first-class principal: a fixed-uid system user with a home on /var and
# exactly the groups the policy grants (/etc/resident/policy.toml [principal]).
#Type Name       ID        GECOS                                   Home              Shell
g     agent      980
u     agent      980:980   "resident resident agent (principal)"    /var/lib/resident  /bin/bash
m     agent      systemd-journal
m     agent      adm
# The human. No password (locked): ssh key only, then sudo. uid 1000 so files match the NUC today.
g     owner  1000
u     owner  1000:1000 "break-glass admin (human)"             ~   /bin/bash
m     owner  sudo
# the owner reads the record (intent log, world model, outbox) and writes to the inbox; credentials stay agent-only (0700)
m     owner  agent
