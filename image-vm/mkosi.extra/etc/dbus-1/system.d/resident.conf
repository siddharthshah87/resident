<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- resident: the agent is a named principal on the system bus.
     - It owns org.resident.Agent (and anything under org.resident.*): other services talk TO the agent
       by name instead of dropping files, and the human can `busctl introspect org.resident.Agent`.
     - It may receive signals from systemd1/login1 (unit state changes, session lock/unlock) so percept
       and agentd can react without polling. Method CALLS to those services are governed by polkit
       (50-resident.rules), not here. -->
<busconfig>
  <policy user="agent">
    <allow own="org.resident.Agent"/>
    <allow own_prefix="org.resident"/>
    <allow send_destination="org.resident.Agent"/>
    <allow receive_sender="org.freedesktop.systemd1" receive_type="signal"/>
    <allow receive_sender="org.freedesktop.login1"  receive_type="signal"/>
  </policy>

  <!-- Anyone local may introspect the agent and ask it a question (Ask → inbox event).
       Nothing else on the org.resident.Agent interface is callable by non-root, non-agent peers. -->
  <policy context="default">
    <allow send_destination="org.resident.Agent" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.resident.Agent" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.resident.Agent" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.resident.Agent" send_interface="org.resident.Agent" send_member="Ask"/>
    <deny  send_destination="org.resident.Agent" send_interface="org.resident.Agent"/>
  </policy>

  <!-- The human (group sudo) has full access to the agent's interface: kill switch, grant, status. -->
  <policy group="sudo">
    <allow send_destination="org.resident.Agent"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.resident.Agent"/>
  </policy>
</busconfig>
