# systemd-boot: short menu, NO command-line editor (an attacker with a keyboard would otherwise
# append systemd.volatile / init=/bin/sh and bypass every policy file). Tries counters in the
# UKI filename (resident_<ver>+3.efi) drive automatic fallback to the previous slot.
timeout 3
editor no
auto-entries 0
auto-firmware 1
console-mode keep
