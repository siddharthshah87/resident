# x86-64 (the default build, e.g. the Intel NUC): kernel, CPU microcode, Intel Wi-Fi firmware, ttyS0.
[Match]
Architecture=x86-64

[Content]
KernelCommandLine=ro console=ttyS0,115200n8 console=tty0 systemd.show_status=auto audit=0 rd.systemd.gpt_auto=yes
Packages=
        linux-image-amd64
        intel-microcode
        firmware-iwlwifi
