# arm64 (the rpi4 profile, or `mkosi --architecture=arm64` for a generic UEFI arm64 image such as
# qemu -M virt). Debian's linux-image-arm64 carries the bcm2711 device trees and drivers.
# Serial: PL011 = ttyAMA0 on qemu virt and on the Pi 4 with pftf's config.txt (dtoverlay=miniuart-bt
# puts the PL011 on GPIO 14/15), 115200 baud. tty0 last = HDMI is /dev/console, as on x86.
[Match]
Architecture=arm64

[Content]
KernelCommandLine=ro console=ttyAMA0,115200 console=tty0 systemd.show_status=auto audit=0 rd.systemd.gpt_auto=yes
Packages=
        linux-image-arm64
