# The rpi4 profile builds for arm64. mkosi parses mkosi.profiles/ AFTER mkosi.conf.d/, so if the
# profile set Architecture= itself, the per-architecture drop-ins below would already have matched
# x86-64. Switching the architecture here, before 10-*.conf, lets [Match] Architecture= see it.
[Match]
Profiles=rpi4

[Distribution]
Architecture=arm64
