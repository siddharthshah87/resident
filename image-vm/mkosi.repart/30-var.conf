# /var: the ONLY persistently writable partition. Holds the agent's state (/var/lib/resident),
# journal, the /etc overlay upper dir, docker, update staging. Mounted via /etc/fstab by PARTLABEL
# (gpt-auto only auto-mounts /var when its UUID is keyed to the machine-id, which we don't know at build).
# Grown to fill the disk on first boot by /usr/lib/repart.d/30-var.conf.
# TODO(prod): Encrypt=key-file or tpm2 — the browser profile and credentials live here.
[Partition]
Type=var
Label=var
Format=ext4
CopyFiles=/var:/
SizeMinBytes=4G
