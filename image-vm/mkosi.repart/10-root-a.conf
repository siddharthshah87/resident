# Root slot A: read-only erofs, dm-verity data partition. Label carries IMAGE_VERSION so
# systemd-sysupdate can see which version occupies the slot (MatchPattern=resident_@v).
# Fixed size: A and B must be identical for sysupdate to stream a slot image into either.
[Partition]
Type=root
Label=resident_%A
Format=erofs
CopyFiles=/
ExcludeFiles=/efi/ /boot/ /var/ /tmp/ /run/ /proc/ /sys/ /dev/
Verity=data
VerityMatchKey=root
ReadOnly=yes
SizeMinBytes=3G
SizeMaxBytes=3G
