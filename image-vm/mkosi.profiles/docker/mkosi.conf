# VARIANT "docker": docker.io for the shop-app containers. /var/lib/docker lives on the /var
# partition (root is verity-sealed). The `agent` user is already in group docker (sysusers.d).
# Build with:  mkosi --profile=docker build      (profiles combine: --profile=desktop,docker)
[Content]
Packages=
        docker.io
        docker-cli
        containerd
