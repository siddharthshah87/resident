# VARIANT "rpi4": arm64 disk image for the Raspberry Pi 4 Model B (also boots any arm64 UEFI machine,
# e.g. qemu -M virt; CI boot-tests it that way). Boot chain: Pi boot ROM/EEPROM → first FAT partition
# (our ESP) → start4.elf + config.txt → RPI_EFI.fd (pftf UEFI firmware, armstub) → EFI/BOOT/BOOTAA64.EFI
# (systemd-boot) → resident_<ver>+3.efi (UKI) → dm-verity erofs root. A/B layout unchanged.
# Build with:  ./stage-rpi4-firmware.sh && ./build.sh --profile=rpi4
#
# Architecture=arm64, the arm64 kernel and the ttyAMA0 console come from mkosi.conf.d/00-rpi4-arch.conf
# + 10-arm64.conf (profiles are parsed after mkosi.conf.d/, see 00-rpi4-arch.conf). Packages= appends.
[Distribution]
Architecture=arm64

[Content]
Packages=
        # Wi-Fi: brcmfmac43455 firmware + brcmfmac43455-sdio.raspberrypi,4-model-b.txt NVRAM
        firmware-brcm80211
        # Bluetooth: BCM4345C0.hcd
        bluez-firmware
# Pi firmware + pftf UEFI land at the ESP root: mkosi.extra/efi/ here → /efi in the build root →
# mkosi.repart/00-esp.conf CopyFiles=/efi:/. Staged (not in git) by ../../stage-rpi4-firmware.sh.
