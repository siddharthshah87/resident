# VARIANT "desktop": minimal Wayland session for the agent's own seat, so percept can see window
# titles/idle and so xdg-desktop-portal ScreenCast/RemoteDesktop exist to be consented to
# (docs/portal-consent.md). Build with:  mkosi --profile=desktop build
[Content]
Packages=
        cage
        seatd
        xwayland
        xdg-desktop-portal
        xdg-desktop-portal-wlr
        xdg-desktop-portal-gtk
        pipewire
        wireplumber
        foot
